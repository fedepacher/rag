services:
  database:
    image: mysql:latest
    ports:
      - 3306:3306
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rag-system
      MYSQL_DATABASE: test_sql
      MYSQL_USER: rag-system
      MYSQL_PASSWORD: rag-system
    networks:
      rag_network:
        aliases:
          - database
    volumes:
      - mysql_data:/var/lib/mysql
    # `api` used to wait on a bare depends_on, which only waits for the container to
    # START, and then raced a 15-second wait-for-it.sh. When the database came back up
    # attached to zero networks, api died with a DNS error naming `database` while
    # `docker compose ps` showed the database as a healthy-looking `Up` — the real cause
    # named nowhere. See #37.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prag-system"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongodb:
    image: mongo:latest
    ports:
      - 27017:27017
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: secret
    networks:
      rag_network:
        aliases:
          - mongodb
    volumes:
      - mongodb_data:/data/db





