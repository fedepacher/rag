  api:
    build:
      context: .
      dockerfile:  Dockerfile_api
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      DB_NAME: test_sql
      DB_USER: rag-system
      DB_PASS: rag-system
      DB_HOST: database
      DB_PORT: 3306
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      SECRET_KEY: 6b3d75e968f26f3be3443503efefd761e22d5e173fea95646a3659e673ebb97b
      MONGO_HOST: mongodb
      MONGO_DB_NAME: test_nosql
      MONGO_PORT: 27017
      MONGO_USER: mongoadmin
      MONGO_PASS: secret
      EMAIL_SERVER: smtp.gmail.com
      EMAIL: ivolutionrecovery@gmail.com
      EMAIL_PROTOCOL: TLS
      EMAIL_BODY: api/app/resources/email/password_changed.txt
      EMAIL_SUBJECT: api/app/resources/email/email_subject.txt
    networks:
      rag_network:
        aliases:
          - api

  rag:
    build:
      context: .
      dockerfile:  Dockerfile-combined
      # Provenance for the evaluation harness (#32). Empty unless exported before the
      # build; see the ARG block at the end of Dockerfile-combined for the command.
      args:
        RAG_COMMIT: ${RAG_COMMIT:-}
        RAG_DIRTY: ${RAG_DIRTY:-}
    depends_on:
      - database
      - mongodb
    ports:
      - "11434:11434"  # For Ollama
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:11434 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ollama:/root/.ollama
      # Without this the index lives in the container's writable layer, so every
      # `down` or `--build` wipes it and the next boot spends ~14.5 min re-embedding
      # 148 chunks at ~6 s each on CPU before answering anything. That cost is paid
      # more often now, because injecting RAG_COMMIT means rebuilding the image
      # whenever the commit changes.
      #
      # Safe only because get_index_hash covers the embedding model as well as the
      # chunk text (6729bec). Before that, a persisted index would have been reloaded
      # with 384-dimensional GPT4All vectors against a 1024-dimensional bge-m3 model
      # and retrieval would have degraded while looking healthy. The missing volume
      # was accidentally hiding that bug — luck, not design, and this removes the
      # luck. tests/test_index_invalidation.py pins the invalidation.
      - faiss_index:/app/resources/faiss_index
    environment:
      API_URL: "http://api:8000"
      DOCUMENT_LOCATION: resources/files
      MONGO_HOST: mongodb
      MONGO_DB_NAME: test_nosql
      MONGO_PORT: 27017
      MONGO_USER: mongoadmin
      MONGO_PASS: secret
      OLLAMA_SERVER_URL: "http://localhost:11434"
    networks:
      rag_network:
        aliases:
          - rag

  email:
